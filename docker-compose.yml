services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: "5000"
      WEB_PORT: "3000"
      API_PROXY_TARGET: http://127.0.0.1:5000
      UPLOADS_DIR: /app/uploads
      DATA_FILE: /app/data/store.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - uploads_data:/app/uploads
      - iia_data:/app/data

volumes:
  uploads_data:
  iia_data:
