name: PostgreSQL migration test
on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]
permissions:
  contents: read
jobs:
  schema:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: iia_test
          POSTGRES_PASSWORD: iia_test_password
          POSTGRES_DB: iia_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U iia_test -d iia_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Wait for PostgreSQL
        env:
          PGPASSWORD: iia_test_password
        run: |
          set -euo pipefail
          for attempt in $(seq 1 30); do
            if pg_isready -h 127.0.0.1 -p 5432 -U iia_test -d iia_test; then
              exit 0
            fi
            sleep 2
          done
          echo "PostgreSQL did not become ready" >&2
          exit 1
      - name: Apply schema twice and verify tables and foreign keys
        env:
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: iia_test
          PGPASSWORD: iia_test_password
          PGDATABASE: iia_test
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -f apps/server/migrations/001_initial_schema.sql
          # Re-running must not fail or duplicate the baseline objects.
          psql -v ON_ERROR_STOP=1 -f apps/server/migrations/001_initial_schema.sql
          TABLE_COUNT=$(psql -Atqc "SELECT count(*) FROM information_schema.tables WHERE table_schema='public' AND table_type='BASE TABLE' AND table_name IN ('users','quizzes','uploaded_documents','attempts','api_keys','payment_orders','subscriptions')")
          test "$TABLE_COUNT" = "7"
          CONSTRAINT_COUNT=$(psql -Atqc "SELECT count(*) FROM pg_constraint WHERE conname IN ('quizzes_source_document_id_fkey','attempts_user_id_fkey','attempts_quiz_id_fkey','subscriptions_payment_order_id_fkey')")
          test "$CONSTRAINT_COUNT" -ge "4"
      - name: Import synthetic JSON snapshot into disposable PostgreSQL and verify data
        env:
          DATABASE_URL: postgresql://iia_test:iia_test_password@127.0.0.1:5432/iia_test
          PGHOST: 127.0.0.1
          PGPORT: 5432
          PGUSER: iia_test
          PGPASSWORD: iia_test_password
          PGDATABASE: iia_test
        run: |
          set -euo pipefail
          cat > /tmp/iia-import-fixture.json <<'JSON'
          {
            "users": [
              {"id":"u-test","name":"Synthetic Test","email":"synthetic@example.test","password":"$test-hash"}
            ],
            "quizzes": [
              {"id":"q-test","title":"Synthetic Quiz","description":"integration fixture","questions":[{"id":"question-1","text":"Question?","options":["A","B"],"correctOptionIndex":0}],"ownerUserId":"u-test","createdAt":"2026-01-01T00:00:00.000Z"}
            ],
            "attempts": [
              {"id":"a-test","userId":"u-test","quizId":"q-test","score":1,"totalQuestions":1,"percentage":100,"passed":true,"createdAt":"2026-01-02T00:00:00.000Z"}
            ],
            "uploadedDocuments": [],
            "apiKeys": [
              {"id":"key-test","ownerUserId":"u-test","name":"synthetic","keyHash":"synthetic-hash","prefix":"iia_test_","createdAt":"2026-01-01T00:00:00.000Z","expiresAt":"2027-01-01T00:00:00.000Z"}
            ],
            "paymentOrders": [
              {"id":"payment-test","userId":"u-test","planId":"basic","amountPaisa":100,"status":"paid","createdAt":"2026-01-01T00:00:00.000Z","paidAt":"2026-01-01T00:01:00.000Z","transactionId":"synthetic-txn"}
            ],
            "subscriptions": [
              {"userId":"u-test","planId":"basic","startsAt":"2026-01-01T00:01:00.000Z","expiresAt":"2027-01-01T00:01:00.000Z","paymentOrderId":"payment-test"}
            ]
          }
          JSON
          node scripts/import-json-to-postgres.cjs /tmp/iia-import-fixture.json --apply
          test "$(psql -Atqc "SELECT count(*) FROM users WHERE id='u-test' AND password_hash='$test-hash'")" = "1"
          test "$(psql -Atqc "SELECT count(*) FROM quizzes WHERE id='q-test' AND jsonb_array_length(questions)=1")" = "1"
          test "$(psql -Atqc "SELECT count(*) FROM attempts WHERE id='a-test' AND passed=true")" = "1"
          test "$(psql -Atqc "SELECT count(*) FROM api_keys WHERE id='key-test' AND key_hash='synthetic-hash'")" = "1"
          test "$(psql -Atqc "SELECT count(*) FROM payment_orders WHERE id='payment-test' AND status='paid'")" = "1"
          test "$(psql -Atqc "SELECT count(*) FROM subscriptions WHERE user_id='u-test' AND payment_order_id='payment-test'")" = "1"
          # A second import must fail safely because the destination is no longer empty.
          if node scripts/import-json-to-postgres.cjs /tmp/iia-import-fixture.json --apply; then
            echo "ERROR: importer unexpectedly accepted a non-empty target" >&2
            exit 1
          fi
          test "$(psql -Atqc "SELECT count(*) FROM users")" = "1"
          test "$(psql -Atqc "SELECT count(*) FROM quizzes")" = "1"
          echo "PASS: synthetic import, field preservation, and non-empty-target guard verified."
